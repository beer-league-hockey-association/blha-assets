# BLHA League Bot settings. Discord IDs go in quotes.
# To copy an ID: Discord User Settings > Advanced > turn on Developer Mode,
# then right-click the server, channel or role > Copy ID.

timezone: America/New_York

discord:
  guild_id: ""                        # the BLHA server
  voting_channel_id: ""               # league-voting
  rulings_log_channel_id: ""          # rulings-log (Review Panel draws)
  commissioner_role_id: ""            # Commissioner role
  assistant_commissioner_role_id: ""  # optional; may run Review Panel draws
  franchise_owner_role_id: ""         # only this role casts a franchise's vote
  co_owner_role_id: ""                # Co-Owner role (/myteam, /tradecheck, Pick'em; never votes)
  pickem_channel_id: ""               # channel for the weekly Pick'em posts
  suggestions_forum_id: ""            # league-suggestions forum (/proposal from-thread)
  scheduled_for_vote_tag_id: ""       # optional; forum tag added when a suggestion becomes a proposal

# One entry per franchise. role_id is that franchise's own Discord role.
# fantrax_team_id is the franchise's Fantrax team ID (run the BLHA Pick Trades
# workflow in preview mode to list them). The IDs below are the 2026-27 TEST
# league's, in draft order; replace them when the real league is created.
# Mark exactly one franchise commissioner: true (it sits out 3.6 votes).
franchises:
  - {name: "Franchise 1", role_id: "", fantrax_team_id: "2tml63mumumuxoqh", commissioner: true}
  - {name: "Franchise 2", role_id: "", fantrax_team_id: "gb4or3npmumb3mgv"}
  - {name: "Franchise 3", role_id: "", fantrax_team_id: "mvh0gxh2mumuxoo4"}
  - {name: "Franchise 4", role_id: "", fantrax_team_id: "8j6llh6gmumuxose"}
  - {name: "Franchise 5", role_id: "", fantrax_team_id: "tau9p1cvmumuxout"}
  - {name: "Franchise 6", role_id: "", fantrax_team_id: "gobvt8opmumuxoxm"}
  - {name: "Franchise 7", role_id: "", fantrax_team_id: "qqpqauuamumuxp03"}
  - {name: "Franchise 8", role_id: "", fantrax_team_id: "vs89xezfmumuxp44"}
  - {name: "Franchise 9", role_id: "", fantrax_team_id: "w9j9rgr1mumuxp9e"}
  - {name: "Franchise 10", role_id: "", fantrax_team_id: "6bzildyomumuxpe6"}
