sources:
  # PRIMARY NHL NEWS — eligible for live delivery after shadow testing
  - id: nhl_latest
    name: NHL.com Latest News
    type: html
    parser: nhl_news
    url: https://www.nhl.com/news/
    tier: 0
    breaking_allowed: true
    discovery_only: false
    enabled: true
    role: primary-official-news

  - id: sportsnet_nhl
    name: Sportsnet NHL
    type: rss
    url: https://www.sportsnet.ca/hockey/nhl/feed/
    tier: 1
    breaking_allowed: true
    discovery_only: false
    enabled: true
    role: primary-national-news

  # CORROBORATION / DISCOVERY — healthy, but not clean enough for blind live posting
  - id: cbs_nhl
    name: CBS Sports NHL
    type: rss
    url: https://www.cbssports.com/rss/headlines/nhl
    tier: 1
    breaking_allowed: false
    discovery_only: true
    enabled: true
    role: national-corroboration
    note: Probe passed, but feed included promotional/non-NHL noise. Keep as corroboration/discovery unless filtering proves clean.

  - id: pro_hockey_rumors
    name: Pro Hockey Rumors
    type: rss
    url: https://www.prohockeyrumors.com/feed
    tier: 2
    breaking_allowed: false
    discovery_only: true
    enabled: true
    role: transactions-free-agency-discovery
    note: Probe parsed successfully despite text/html content type. Never authoritative for Breaking News without Tier 0/1 confirmation.

  - id: reddit_hockey
    name: r/hockey
    type: rss
    url: https://www.reddit.com/r/hockey/.rss
    tier: 3
    breaking_allowed: false
    discovery_only: true
    enabled: true
    role: community-discovery

  # TRANSACTION BACKUPS — PuckPedia native Discord integration will be primary live feed
  - id: eliteprospects_nhl_transactions
    name: Elite Prospects NHL Transactions
    type: rss
    url: https://www.eliteprospects.com/rss/league/nhl/transactions
    tier: 1
    breaking_allowed: false
    discovery_only: true
    enabled: true
    force_channel: nhl-transactions
    role: transaction-backup
    note: Healthy feed, but probe showed edge cases such as same-team/self transactions. Keep as backup/corroboration until stricter transaction filtering is enabled.

  - id: eliteprospects_recalls
    name: Elite Prospects Recalls and Reassignments
    type: rss
    url: https://www.eliteprospects.com/rss/transfers/up-down
    tier: 1
    breaking_allowed: false
    discovery_only: true
    enabled: true
    force_channel: nhl-transactions
    role: recalls-assignments-backup
    note: Global feed includes non-NHL movements. Discovery/backstop only unless NHL-affiliation filtering is applied.

  - id: eliteprospects_extensions
    name: Elite Prospects Contract Extensions
    type: rss
    url: https://www.eliteprospects.com/rss/transfers/extension
    tier: 1
    breaking_allowed: false
    discovery_only: true
    enabled: true
    force_channel: nhl-transactions
    role: contract-extensions-backup
    note: Global feed includes non-NHL and junior extensions. Discovery/backstop only unless NHL filtering is applied.

  # PROSPECT / DEVELOPMENT — suitable for prospect-wire after content filtering
  - id: ahl_official
    name: American Hockey League
    type: rss
    url: https://theahl.com/feed
    tier: 1
    breaking_allowed: false
    discovery_only: false
    enabled: true
    force_channel: prospect-wire
    role: official-ahl-news

  - id: thw_prospects
    name: The Hockey Writers Prospects
    type: rss
    url: https://thehockeywriters.com/category/prospects/feed
    tier: 2
    breaking_allowed: false
    discovery_only: false
    enabled: true
    force_channel: prospect-wire
    role: prospect-analysis

  - id: dobber_prospects
    name: DobberProspects
    type: rss
    url: https://dobberprospects.com/feed/
    tier: 2
    breaking_allowed: false
    discovery_only: false
    enabled: true
    force_channel: prospect-wire
    role: fantasy-prospect-analysis
    note: Probe passed with a healthy RSS feed. Excellent dynasty-focused prospect source.

  - id: uscho
    name: USCHO College Hockey
    type: rss
    url: https://www.uscho.com/feed/
    tier: 2
    breaking_allowed: false
    discovery_only: false
    enabled: true
    force_channel: prospect-wire
    role: ncaa-news

  # DISABLED / PARSER WORK
  - id: college_hockey_news
    name: College Hockey News
    type: html
    parser: college_hockey_news
    url: https://www.collegehockeynews.com/news/
    tier: 1
    breaking_allowed: false
    discovery_only: false
    enabled: false
    force_channel: prospect-wire
    role: ncaa-news
    note: Page probe passed. Enable after exact RSS endpoint or dedicated parser is finalized.

  - id: thw_global
    name: The Hockey Writers Global
    type: rss
    url: https://thehockeywriters.com/feed/
    tier: 2
    breaking_allowed: false
    discovery_only: true
    enabled: false
    role: broad-discovery
    note: Feed is healthy but redundant with stronger sources and mixes news, analysis and rumors.

  - id: espn_nhl
    name: ESPN NHL
    type: rss
    url: https://www.espn.com/espn/rss/nhl/news
    tier: 1
    breaking_allowed: false
    discovery_only: true
    enabled: false
    note: Disabled after repeated probe returned zero entries / HTTP 202 behavior. Retain only for periodic retest.

planned_integrations:
  - id: puckpedia_discord
    name: PuckPedia Discord Integration
    type: native-discord-webhook
    target: nhl-transactions
    status: recommended-primary
    note: Preferred live transaction source for NHL trades, signings and waivers; avoids duplicating work already handled well by PuckPedia.

planned_sources:
