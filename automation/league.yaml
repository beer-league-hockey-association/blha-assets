# League-wide settings shared by every BLHA automation.
#
# When the real 2027-28 league is created on Fantrax, change league_id and
# season_label here. Everything else (week dates, playoff weeks, number of
# playoff teams, the season calendar) is read from Fantrax automatically.

league_id: w02cjakmmumb3lur
season_label: "2026-27 TEST"
timezone: America/New_York

# BLHA gold accent used by Competition Desk posts.
color: 0xFFB81C

competition:
  # The weekly report goes out at or after this local time on the morning a
  # fantasy week ends (normally Monday).
  report_time: "08:00"

  # Playoff race posts begin with this week's report and run through the
  # last regular-season week.
  playoff_race_start_week: 16

  # Teams just below the playoff line shown in the playoff race.
  bubble_depth: 3

  # Credited goalie starts per calendar week (Constitution 9.2). The live
  # scoreboard shows "Goalie starts: X of Y" with Y = this x the period's
  # calendar weeks, so a two-week period such as the Championship gets 8 (9.3).
  goalie_starts_per_week: 4

  # Weekly NHL games grid (posted after the matchup preview): a night is
  # "light" when this many teams or fewer play, and "heavy" when at least
  # heavy_night_min_teams play.
  light_night_max_teams: 8
  heavy_night_min_teams: 20

  # GitHub Actions secret holding each channel's Discord webhook URL.
  # awards and rankings go to #weekly-recap with the recap; games (the NHL
  # games grid) goes to the scoreboard channel with the matchup preview.
  webhooks:
    recap: BLHA_WEBHOOK_WEEKLY_RECAP
    awards: BLHA_WEBHOOK_WEEKLY_RECAP
    rankings: BLHA_WEBHOOK_WEEKLY_RECAP
    standings: BLHA_WEBHOOK_STANDINGS
    playoff_race: BLHA_WEBHOOK_PLAYOFF_RACE
    preview: BLHA_WEBHOOK_SCOREBOARD
    games: BLHA_WEBHOOK_SCOREBOARD
    scoreboard: BLHA_WEBHOOK_SCOREBOARD
    playoffs: BLHA_WEBHOOK_PLAYOFFS

# ---------------------------------------------------------------------------
# Owner pings (opt-in)
#
# Owners listed here are mentioned:
#   - by the Wire, when a player on their BLHA roster shows up in the Injury
#     Report (wire_pings below), and
#   - by Lineup Alerts, when a starter has no NHL game today while an
#     eligible bench player does (lineup_alerts below).
# Only owners listed here are ever pinged, and only about their own team.
#
# Key: the BLHA team's Fantrax team name (or Fantrax team ID).
# Value: the owner's Discord user ID, in quotes. In Discord: User Settings ->
#        Advanced -> turn on Developer Mode, then right-click the member ->
#        Copy User ID.
#
# Example:
#   owners:
#     "Test 4": "123456789012345678"
owners: {}

wire_pings:
  injuries: true

# ---------------------------------------------------------------------------
# Lineup Alerts (automation/lineup/)
#
# Once a day (about 3:00 PM ET, regular season and playoffs) each owner listed
# under `owners` gets one short message, with a mention, when a player in
# today's ACTIVE lineup has no NHL game while an eligible RESERVE player does.
# Owners not listed under `owners` are never checked or pinged.
# webhook: GitHub Actions secret holding the #lineup-alerts webhook URL.
lineup_alerts:
  webhook: BLHA_WEBHOOK_LINEUP_ALERTS

# ---------------------------------------------------------------------------
# Commissioner Desk (private reminders for the commissioner's manual work)
#
# webhook:      GitHub Actions secret holding the private channel's webhook URL.
# ping_user_id: optional. Your Discord user ID, in quotes, to get an @mention
#               with each reminder. Leave "" for a silent post.
commissioner_desk:
  webhook: BLHA_WEBHOOK_COMMISSIONER_DESK
  ping_user_id: "1059135310132424814"

# ---------------------------------------------------------------------------
# Draft Center (automation/draft/)
#
# Countdown, draft-order reveal and round-by-round recap in Discord, plus a
# private Commissioner Desk alert when a pick clock runs out or a pick is
# skipped. No on-the-clock or per-pick posts: Fantrax sends those.
# The draft date, order, rounds and picks come from Fantrax. Fantrax does not
# publish the pick clock, so it is set here from the Constitution.
draft_center:
  webhooks:
    announcements: BLHA_WEBHOOK_DRAFT_ANNOUNCEMENTS
    results: BLHA_WEBHOOK_DRAFT_RESULTS
  # Countdown posts before the Fantrax draft date. The first one sent is the
  # full announcement (Art. 5.9: announce at least 30 days ahead).
  countdown: ["30d", "7d", "1d", "1h", "start"]
  # When the official draft order is posted, before the draft date.
  order_reveal: "7d"
  # Nightly pick-clock pause, Eastern time (Art. 13.4, 14.3).
  pause: ["00:00", "08:00"]
  drafts:
    startup:
      pick_clock_hours: 4   # Art. 13.1
    annual:
      pick_clock_hours: 8   # Art. 14.3
  # TEST ONLY: pick clock in minutes for a fast test draft. Set back to null
  # before the real startup draft.
  test_pick_clock_minutes: null
