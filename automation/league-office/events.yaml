settings:
  timezone: America/New_York
  default_channel: league-calendar
  catchup_window_hours: 24
  default_reminders:
    - 14d
    - 7d
    - 3d
    - 1d
    - 3h
    - 1h
    - start

channels:
  league-calendar:
    secret: BLHA_WEBHOOK_LEAGUE_CALENDAR
    color: 0xC68F15
    label: "LEAGUE CALENDAR"
  league-announcements:
    secret: BLHA_WEBHOOK_LEAGUE_ANNOUNCEMENTS
    color: 0xD4AF37
    label: "LEAGUE ANNOUNCEMENT"
  # Private commissioner channel: reminders for manual work that keeps the
  # league on track. Fantrax-timed reminders live in commissioner/tasks.yaml.
  commissioner-desk:
    secret: BLHA_WEBHOOK_COMMISSIONER_DESK
    color: 0xFFB81C
    label: "COMMISSIONER DESK"

# Keep events disabled until their actual BLHA dates are finalized.
# starts_at may be entered as local New York wall-clock time without an offset,
# for example: 2027-01-15T20:00:00. The automation applies America/New_York
# and therefore handles EST/EDT automatically. Explicit offsets remain valid.
#
# catchup_window_hours allows a reminder that GitHub started late to be posted
# after its trigger. Reminders never post before their trigger and each
# event/reminder/channel combination remains protected by persistent state.
#
# announcement_reminders duplicates only the specified reminders into
# league-announcements for high-priority league deadlines/milestones.
events:
  # Draft countdowns are posted by the Draft Center from the Fantrax draft date
  # (automation/draft/), so there are no draft events here.

  - id: trade-deadline
    enabled: false
    title: "BLHA Trade Deadline"
    type: deadline
    starts_at: null
    channel: league-calendar
    priority: high
    description: "The BLHA in-season trade window closes at this deadline."
    reminders: [14d, 7d, 3d, 1d, 3h, 1h, start]
    announcement_reminders: [7d, 1d, 3h, 1h, start]

  - id: dues-deadline
    enabled: false
    title: "BLHA Dues Deadline"
    type: finance
    starts_at: null
    channel: league-calendar
    priority: high
    description: "League dues must be paid by this deadline."
    reminders: [14d, 7d, 3d, 1d, start]
    announcement_reminders: [7d, 1d, start]

  - id: opening-night
    enabled: false
    title: "BLHA Opening Night"
    type: season
    starts_at: null
    channel: league-calendar
    priority: normal
    description: "The BLHA regular season begins."
    reminders: [7d, 3d, 1d, 3h, 1h, start]
    announcement_reminders: [1d, start]

  - id: playoffs-begin
    enabled: false
    title: "BLHA Playoffs Begin"
    type: playoffs
    starts_at: null
    channel: league-calendar
    priority: high
    description: "The BLHA championship playoffs begin."
    reminders: [7d, 3d, 1d, 3h, 1h, start]
    announcement_reminders: [3d, 1d, start]

  # ---------------------------------------------------------------------------
  # Commissioner Desk reminders (private). These are dates Fantrax cannot know:
  # they come from the NHL calendar or from deadlines you set. Set starts_at to
  # the date each one is due, then set enabled: true. See the Commissioner
  # Season Checklists for the full list.

  - id: commissioner-calendar-due
    enabled: false
    title: "Publish the League Calendar"
    type: commissioner
    starts_at: null   # NHL schedule release date + 14 days (Art. 5.5)
    channel: commissioner-desk
    priority: high
    description: "The League Calendar is due within 14 days after the NHL releases its schedule. Convert every formula date, post it in #league-calendar and create the Sesh events."
    reminders: [7d, 3d, 1d, start]

  - id: commissioner-draft-announcement
    enabled: false
    title: "Set the draft date in Fantrax"
    type: commissioner
    starts_at: null   # Draft date minus 31 days, so it is in Fantrax before the 30-day announcement
    channel: commissioner-desk
    priority: high
    description: "The draft must be announced at least 30 days ahead (Art. 5.9). Set the date, order and pick clock in Fantrax now; the Draft Center posts the public announcement automatically 30 days out. Post the timeout procedure (13.5) yourself."
    reminders: [7d, 3d, 1d, start]

  - id: commissioner-dues-notice
    enabled: false
    title: "Dues deadline notice due"
    type: commissioner
    starts_at: null   # Dues deadline minus 30 days (Art. 3.2)
    channel: commissioner-desk
    priority: normal
    description: "Owners need at least 30 days' notice of the dues deadline. Post it with the accepted payment methods."
    reminders: [7d, 3d, 1d, start]

  - id: commissioner-dues-deadline
    enabled: false
    title: "Dues deadline: confirm payments"
    type: commissioner
    starts_at: null   # The dues deadline itself
    channel: commissioner-desk
    priority: high
    description: "Check the League Ledger. Send written notice in Discord and by DM to every unpaid franchise (Art. 3.4). Unpaid franchises cannot draft."
    reminders: [3d, 1d, start]

  - id: commissioner-dues-escalation
    enabled: false
    title: "7 days past the dues deadline"
    type: commissioner
    starts_at: null   # Dues deadline plus 7 days (Art. 3.4)
    channel: commissioner-desk
    priority: high
    description: "A franchise still unpaid today may be treated as orphaned and its owner replaced (Art. 3.4, 18)."
    reminders: [1d, start]

  - id: commissioner-amendment-deadline
    enabled: false
    title: "Last day to open an amendment vote"
    type: commissioner
    starts_at: null   # Dues deadline minus 7 days (Art. 20.3, 20.4)
    channel: commissioner-desk
    priority: normal
    description: "A vote for next season must finish before the dues deadline. Proposals are posted 7 days before voting opens and the window is 7 days. Make sure the voting bot is running."
    reminders: [21d, 14d, 7d, start]

  - id: commissioner-trading-reopens
    enabled: false
    title: "Renew the league: trading reopens"
    type: commissioner
    starts_at: null   # The day after the Stanley Cup Final ends (Art. 5.9, 11.6)
    channel: commissioner-desk
    priority: high
    description: "Renew the league in Fantrax for next season today; Fantrax lets you renew a day or two after the NHL regular season, but wait until now. Renewal reopens all transactions, including trades and draft-pick trades, keeps traded picks and Premium, and resets every FAAB budget to $1,000: add the consolation champion's $50 by hand (10.7) and don't use Recalculate free agent budgets afterward. If the renewed league has a new league ID, run BLHA Season Rollover with it. Then announce that trading is open."
    reminders: [1d, start]

  - id: commissioner-token-renewal
    enabled: false
    title: "Renew the scheduler GitHub token"
    type: commissioner
    starts_at: null   # Token expiry date minus 7 days
    channel: commissioner-desk
    priority: high
    description: "The fine-grained token used by the cron-job.org timer is about to expire. Create a new one and update the cron-job.org header. If it lapses, the health monitor reports a stale Scheduler."
    reminders: [14d, 7d, start]

  - id: commissioner-github-api-version
    enabled: true
    title: "Update the GitHub API version before it retires"
    type: commissioner
    starts_at: "2027-05-03T09:00:00"
    channel: commissioner-desk
    priority: normal
    description: "GitHub retires API version 2022-11-28 on March 10, 2028; 2026-03-10 is the newer one. Ask Claude to update the version header in the scheduler, health check and dormancy guard code, then change X-GitHub-Api-Version in both cron-job.org jobs (BLHA Scheduler Timer and BLHA Dormancy Guard) and test-run each."
    reminders: [start]

  - id: commissioner-amendment-vote-date
    enabled: true
    title: "Confirm when amendment votes open"
    type: commissioner
    starts_at: "2027-08-02T09:00:00"
    channel: commissioner-desk
    priority: normal
    description: "No amendment vote before the Offseason after Season 2027 (20.1). Once the Season 2027 League Calendar is published, check amendment_votes_from in bot/config.yaml (now 2028-04-10) is the day after the Championship's final scoring period, and ask Claude to change it if not."
    reminders: [start]

  - id: commissioner-premium-renewal
    enabled: false
    title: "Pay Fantrax Premium for the season"
    type: commissioner
    starts_at: null   # Your chosen date before the draft or Week 1
    channel: commissioner-desk
    priority: normal
    description: "Pay from the League Operating Reserve and log it for the Season Ledger (Art. 3.7). Renew any paid bot or hosting plans the same way and disclose them."
    reminders: [14d, 3d, start]
