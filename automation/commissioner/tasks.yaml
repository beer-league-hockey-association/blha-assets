# Commissioner Desk reminders that Fantrax's own calendar can time.
#
# Every task fires once, in the private commissioner channel, when its anchor
# moment plus offset arrives. Anchors come from the Fantrax season, so they
# move on their own when the real 2027-28 calendar is created. Dates that
# depend on the NHL or on money (dues deadline, draft announcement, the day
# trading reopens) cannot be derived from Fantrax; those are reminders in
# automation/league-office/events.yaml sent to the same channel.
#
# Anchors
#   first_week_start     Start of Week 1.
#   trade_deadline_final When the trade-deadline week is final (Monday 6 AM ET
#                        after the Sunday deadline). The deadline week is the
#                        last regular week minus settings.trade_deadline_weeks_before_end.
#   last_regular_final   When the last regular-season week is final.
#   playoff_start:N      Start of playoff round N (1 = quarterfinals).
#   season_end_final     When the final championship week is final.
#
# Offsets look like 2h, -6h, 14d (negative = before the anchor).

settings:
  # Constitution 11.6: deadline is the end of Week 20 of 22, i.e. 2 weeks before the last regular week.
  trade_deadline_weeks_before_end: 2
  # A reminder inside this window counts as on time.
  catchup_window_hours: 36
  # After that it is still posted, marked OVERDUE, until this many days late.
  # Past that it is considered irrelevant and is never posted. A task can set
  # its own overdue_days.
  overdue_window_days: 7

tasks:
  - id: preseason-week
    anchor: first_week_start
    offset: -7d
    title: "Week 1 starts in 7 days"
    section: "1. Before Season"
    items:
      - "Every $150 is confirmed in the League Ledger; unpaid franchises have written notice (Art. 3.3, 3.4)."
      - "Fantrax: FAAB is $1,000 per team (last consolation champion $1,050), trade deadline set, goalie Max GP 4, waiver tiebreaker Earliest Bid."
      - "Waiver tiebreaker setting posted in Discord (10.4); League Calendar pinned."
      - "league.yaml and events.yaml point at this season; Xenon backup taken."

  - id: preseason-eve
    anchor: first_week_start
    offset: -1d
    title: "Week 1 starts tomorrow"
    section: "1. Before Season"
    items:
      - "No illegal rosters and no ineligible minors left to fix (6.4, 7.4)."
      - "#automation-health is quiet; scoreboard and weekly report previews look right."

  - id: deadline-passed
    anchor: trade_deadline_final
    offset: 2h
    title: "The trade deadline has passed"
    section: "2. During Season"
    items:
      - "Confirm Fantrax now blocks trades, including draft picks. If it does not, lock them by hand and post a notice (11.6)."
      - "Trading stays closed until 12:00 AM ET the day after the Stanley Cup Final ends; the reopening reminder is in events.yaml."

  - id: wrapup
    anchor: last_regular_final
    offset: 2h
    title: "Regular season is final: seed the playoffs"
    section: "3. End of Season, Part A"
    items:
      - "Confirm Fantrax counted all weeks, then resolve every tie under 15.4 and record any random draw in Discord."
      - "Verify the saved playoff seeds match Fantrax standings; announce the field and bracket."
      - "Crown the Presidents' Trophy winner (best head-to-head record)."
      - "Enter consolation round 1 by hand before Week 23 starts: seed 3 v 6 and seed 4 v 5 among the six non-playoff teams; seeds 1 and 2 on byes (16.7)."
      - "Record Potential Points for the six non-playoff teams for picks 1.01 to 1.06 (14.5), and keep a screenshot."
      - "Decide the third-place plan: Fantrax game, or the 16.4 fallback posted in advance."

  - id: consolation-r1
    anchor: playoff_start:1
    offset: -6h
    title: "Playoffs start in 6 hours"
    section: "3. End of Season, Part A"
    items:
      - "Consolation round 1 is entered in Fantrax (Setup > Schedules > Consolation Brackets)."
      - "Championship bracket shows Seed 3 v 6 and Seed 4 v 5 with byes for seeds 1 and 2."

  - id: round-2
    anchor: playoff_start:2
    offset: -6h
    title: "Semifinals start in 6 hours"
    section: "4. Playoffs"
    items:
      - "Fantrax reseeded: highest remaining seed plays the lowest (16.2). Fix by hand if not."
      - "Consolation bracket reseeded the same way, with exact ties going to the higher seed (16.5, 16.7)."
      - "Quarterfinal losers recorded for picks 1.07 and 1.08, lower regular-season seed first (14.6)."

  - id: round-3
    anchor: playoff_start:3
    offset: -6h
    title: "Championship week starts in 6 hours"
    section: "4. Playoffs"
    items:
      - "Two-week cumulative final: 8 credited goalie starts total and 5 acquisitions in each underlying week (9.3, 10.5)."
      - "Third-place matchup is staged, or the 16.4 fallback has been announced."
      - "Consolation final is staged."

  - id: closeout
    anchor: season_end_final
    offset: 2h
    title: "Season complete: close-out starts now"
    overdue_days: 30
    section: "3. End of Season, Part B"
    items:
      - "Confirm champion, runner-up, third and fourth place, and the consolation champion."
      - "Post to #hall-of-champions and #league-records; update every franchise's Dynasty Pot championship count (4.3)."
      - "Finish the draft order: 1.07 and 1.08 quarterfinal losers, 1.09 fourth, 1.10 third, 1.11 runner-up, 1.12 champion (14.6)."
      - "Record the consolation champion's $50 FAAB bonus for next season (10.7)."
      - "Prizes and the Season Ledger are due within 30 days (3.9)."

  - id: prizes-day-14
    anchor: season_end_final
    offset: 14d
    title: "Prizes and Season Ledger due in 16 days"
    overdue_days: 16
    section: "3. End of Season, Part B"
    items:
      - "Pay Champion $650, Runner-Up $350, Third $150 and Presidents' Trophy $200, and record each in the Ledger."
      - "Publish the Season Ledger in #ledger: dues, prizes, reserve spending, $100 Administration Fee, Dynasty Pot balance (3.9, 4.7)."

  - id: prizes-day-25
    anchor: season_end_final
    offset: 25d
    title: "Prizes and Season Ledger due in 5 days"
    overdue_days: 5
    section: "3. End of Season, Part B"
    items:
      - "Anything unpaid or unpublished from the Part B list needs to be finished this week (3.9)."

  - id: prizes-day-29
    anchor: season_end_final
    offset: 29d
    title: "Prizes and Season Ledger due tomorrow"
    overdue_days: 2
    section: "3. End of Season, Part B"
    items:
      - "The 30-day deadline is tomorrow. Confirm every prize is paid and the Season Ledger is posted (3.9)."
