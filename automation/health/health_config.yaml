settings:
  webhook_secret: BLHA_WEBHOOK_AUTOMATION_HEALTH
  username: "BLHA Systems Desk"
  alert_color: 0xC73E3A
  recovery_color: 0x2E7D32
  test_color: 0xFFB81C
  wire_persistent_source_runs: 3
  # A one-off flood-guard event can simply be a legitimate burst of news.
  # Alert only if the Wire hits the guard in consecutive scheduled runs.
  wire_rate_guard_consecutive_runs: 2
  # Newly created scheduled workflows can take time to receive their first
  # GitHub schedule event. Do not treat that startup window as an outage.
  no_run_grace_minutes: 1440

workflows:
  # The scheduler starts every other workflow. If it goes stale, the external
  # timer (cron-job.org) has probably stopped and only GitHub's late backup
  # cron is running. See automation/scheduler/README.md.
  - id: scheduler
    name: "BLHA Scheduler"
    file: "blha-scheduler.yml"
    max_age_minutes: 45

  - id: wire-engine
    name: "BLHA Wire Engine"
    file: "blha-wire-engine.yml"
    # The scheduler starts the Wire every 15 minutes; alert after several
    # missed starts, not after a single delayed one.
    max_age_minutes: 60
    inspect_wire_logs: true

  - id: league-office
    name: "BLHA League Office Automation"
    file: "blha-league-office.yml"
    max_age_minutes: 180

  - id: competition-desk
    name: "BLHA Competition Desk"
    file: "blha-competition-desk.yml"
    # Checks at 08:00 and 20:00 during the season.
    max_age_minutes: 900

  - id: scoreboard
    name: "BLHA Fantrax Scoreboard"
    file: "blha-fantrax-scoreboard.yml"
    # Hourly during the regular season and playoffs.
    max_age_minutes: 180

  - id: playoffs
    name: "BLHA Fantrax Playoffs"
    file: "blha-fantrax-playoffs.yml"
    # Hourly during the playoff weeks only.
    max_age_minutes: 180

  - id: draft-center
    name: "BLHA Draft Center"
    file: "blha-draft-center.yml"
    # Every 15 minutes, only from 31 days before a Fantrax draft until a day after it.
    max_age_minutes: 60

  - id: commissioner-desk
    name: "BLHA Commissioner Desk"
    file: "blha-commissioner-desk.yml"
    # Hourly all year.
    max_age_minutes: 180

  - id: pick-trades
    name: "BLHA Pick Trades"
    file: "blha-pick-trades.yml"
    # Every 15 minutes all year; alert after several missed runs.
    max_age_minutes: 90

  - id: minor-eligibility
    name: "BLHA Minor Eligibility"
    file: "blha-minor-eligibility.yml"
    # Once a day at 07:00.
    max_age_minutes: 1700

  - id: prospect-board
    name: "BLHA Prospect Board"
    file: "blha-prospect-board.yml"
    # Once a day at 09:30.
    max_age_minutes: 1700

  - id: dormancy-guard
    name: "BLHA Dormancy Guard"
    file: "blha-dormancy-guard.yml"
    # Once a day at 06:15.
    max_age_minutes: 1700

  - id: archive
    name: "BLHA League Archive"
    file: "blha-archive.yml"
    # Once a day at 05:30.
    max_age_minutes: 1700

  - id: history-site
    name: "BLHA History Site"
    file: "blha-history-site.yml"
    # Once a week.
    max_age_minutes: 11600
