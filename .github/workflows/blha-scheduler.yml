name: BLHA Scheduler
run-name: BLHA Scheduler — ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'dry-run' || 'live' }}

# The one place automation timing lives. See automation/scheduler/README.md.
#
# Primary trigger: an external timer (cron-job.org) calls GitHub's
# workflow_dispatch API for this file every 15 minutes.
# Backup trigger: GitHub cron below, which is best-effort and often late.
# Either way, the scheduler only starts jobs that are actually due, so extra
# or duplicate starts are harmless.

on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what is due; do not start anything"
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: read

concurrency:
  group: blha-scheduler
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/common-requirements.txt

      - name: Install dependencies
        run: pip install -r automation/common-requirements.txt

      - name: Start due automations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        shell: bash
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            python automation/scheduler/scheduler.py --dry-run
          else
            python automation/scheduler/scheduler.py
          fi

      # Optional outside check-in (healthchecks.io). A ping after every live run;
      # if pings stop, Healthchecks emails you or posts to Discord. Never fails the run.
      - name: Check in with the outside monitor
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          PING_URL: ${{ secrets.BLHA_HEALTHCHECK_PING_URL }}
          OUTCOME: ${{ job.status }}
        shell: bash
        run: |
          if [[ -z "$PING_URL" ]]; then
            echo "No BLHA_HEALTHCHECK_PING_URL secret; skipping the outside check-in."
            exit 0
          fi
          url="$PING_URL"
          [[ "$OUTCOME" == "success" ]] || url="$PING_URL/fail"
          curl -fsS -m 10 --retry 3 -o /dev/null "$url" && echo "Checked in ($OUTCOME)." || echo "Check-in did not go through; the run itself is unaffected."
