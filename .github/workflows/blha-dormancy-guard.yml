name: BLHA Dormancy Guard
run-name: BLHA Dormancy Guard — ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}

# Keeps GitHub from silently switching the scheduled workflows off after 60
# days without repository activity. It deliberately has no `schedule:` trigger
# of its own, so GitHub cannot disable it that way. The BLHA Scheduler starts
# it daily, and a second cron-job.org job (see automation/scheduler/README.md)
# starts it directly in case the scheduler itself has been disabled.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = log only; test = one [TEST] message; live = re-enable and alert"
        required: true
        default: preview
        type: choice
        options: [preview, test, live]

permissions:
  actions: write
  contents: write

concurrency:
  group: blha-dormancy-guard
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore saved state
        run: bash automation/tools/state_branch.sh restore "automation/health/state/dormancy.json"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/common-requirements.txt

      - name: Install dependencies
        run: pip install -r automation/common-requirements.txt

      - name: Check workflows and repository activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLHA_WEBHOOK_COMMISSIONER_DESK: ${{ secrets.BLHA_WEBHOOK_COMMISSIONER_DESK }}
        run: python automation/health/dormancy.py --mode "$MODE"

      - name: Save state to the automation-state branch
        if: ${{ !cancelled() && env.MODE == 'live' }}
        run: |
          bash automation/tools/state_branch.sh save \
            "chore(health): save dormancy warning state" \
            "BLHA Fantrax Automation" \
            "automation/health/state/dormancy.json"
