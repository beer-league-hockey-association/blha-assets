name: BLHA Wire Webhook Test
run-name: "BLHA Wire Webhook Test — ${{ github.event.inputs.channel }}"

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Choose which BLHA Wire webhook to test.'
        required: true
        default: choose-channel
        type: choice
        options:
          - choose-channel
          - breaking-news
          - nhl-news
          - injury-report
          - prospect-wire
          - all

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BLHA_WEBHOOK_BREAKING_NEWS: ${{ secrets.BLHA_WEBHOOK_BREAKING_NEWS }}
      BLHA_WEBHOOK_NHL_NEWS: ${{ secrets.BLHA_WEBHOOK_NHL_NEWS }}
      BLHA_WEBHOOK_INJURY_REPORT: ${{ secrets.BLHA_WEBHOOK_INJURY_REPORT }}
      BLHA_WEBHOOK_PROSPECT_WIRE: ${{ secrets.BLHA_WEBHOOK_PROSPECT_WIRE }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Send controlled BLHA Wire test
        shell: bash
        run: |
          CHANNEL="${{ github.event.inputs.channel }}"
          echo "Selected channel: $CHANNEL"
          if [ "$CHANNEL" = "choose-channel" ]; then
            echo "::error::Select a real channel before running this workflow."
            exit 1
          fi
          python automation/phase-2d1/test_delivery.py --channel "$CHANNEL"
