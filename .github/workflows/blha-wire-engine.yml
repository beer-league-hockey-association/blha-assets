name: BLHA Wire Engine
run-name: BLHA Wire Engine — ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}

on:
  # Timing lives in automation/scheduler/schedule.yaml; the BLHA Scheduler
  # starts this workflow with mode=live every 15 minutes.
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode. Manual runs default to shadow for safe testing.'
        required: true
        default: shadow
        type: choice
        options:
          - shadow
          - live
      reset_state:
        description: 'Reset dedupe state before this run (use only for testing/calibration).'
        required: false
        default: false
        type: boolean
      include_discovery:
        description: 'Also fetch discovery/corroboration sources for this manual run.'
        required: false
        default: false
        type: boolean

concurrency:
  group: blha-wire-engine
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WIRE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}
      RESET_STATE: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_state || false }}
      INCLUDE_DISCOVERY: ${{ github.event_name == 'workflow_dispatch' && inputs.include_discovery || false }}
      BLHA_WEBHOOK_BREAKING_NEWS: ${{ secrets.BLHA_WEBHOOK_BREAKING_NEWS }}
      BLHA_WEBHOOK_NHL_NEWS: ${{ secrets.BLHA_WEBHOOK_NHL_NEWS }}
      BLHA_WEBHOOK_INJURY_REPORT: ${{ secrets.BLHA_WEBHOOK_INJURY_REPORT }}
      BLHA_WEBHOOK_PROSPECT_WIRE: ${{ secrets.BLHA_WEBHOOK_PROSPECT_WIRE }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: automation/wire/requirements.txt

      - name: Install dependencies
        run: pip install -r automation/wire/requirements.txt

      - name: Run BLHA Wire engine
        shell: bash
        run: |
          ARGS=(--mode "$WIRE_MODE")
          if [ "$RESET_STATE" = "true" ]; then
            ARGS+=(--reset-state)
          fi
          if [ "$INCLUDE_DISCOVERY" = "true" ]; then
            ARGS+=(--include-discovery)
          fi
          python automation/wire/engine.py "${ARGS[@]}"

      - name: Persist dedupe state
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          STATE="automation/wire/state/${WIRE_MODE}.json"
          if git diff --quiet -- "$STATE"; then
            echo "No state changes to persist."
            exit 0
          fi

          # Ignore a timestamp-only change. This prevents a meaningless commit
          # every 15 minutes when there were no new stories or state expirations.
          set +e
          python - "$STATE" <<'PY'
          import json, subprocess, sys
          path = sys.argv[1]
          current = json.load(open(path, encoding='utf-8'))
          previous = json.loads(subprocess.check_output(['git', 'show', f'HEAD:{path}'], text=True))
          current.pop('updated_at', None)
          previous.pop('updated_at', None)
          if current == previous:
              sys.exit(10)
          PY
          STATUS=$?
          set -e

          if [ "$STATUS" -eq 10 ]; then
            git checkout -- "$STATE"
            echo "Only updated_at changed; skipping state commit."
            exit 0
          elif [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          fi

          bash automation/tools/persist_state.sh \
            "$STATE" \
            "chore(wire): persist ${WIRE_MODE} dedupe state [skip ci]" \
            "BLHA Wire Automation"
