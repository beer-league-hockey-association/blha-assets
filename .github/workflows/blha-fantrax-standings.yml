name: BLHA Fantrax Standings
run-name: BLHA Fantrax Standings — ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}

on:
  # Timing lives in automation/scheduler/schedule.yaml; the BLHA Scheduler
  # starts this workflow with mode=live when it is due.
  workflow_dispatch:
    inputs:
      mode:
        description: "Standings mode"
        required: true
        default: preview
        type: choice
        options: [preview, test, baseline, live]
      force:
        description: "Force a live post even if standings are unchanged"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: blha-fantrax-standings
  cancel-in-progress: false

jobs:
  standings:
    runs-on: ubuntu-latest
    env:
      INPUT_MODE: ${{ inputs.mode }}
      INPUT_FORCE: ${{ inputs.force }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/common-requirements.txt

      - name: Install dependencies
        run: pip install -r automation/common-requirements.txt

      - name: Run Fantrax standings automation
        env:
          BLHA_WEBHOOK_STANDINGS: ${{ secrets.BLHA_WEBHOOK_STANDINGS }}
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "Scheduled standings snapshot -> LIVE mode"
            python automation/phase-2d3/standings.py --mode live
            exit $?
          fi

          ARGS=(--mode "$INPUT_MODE")
          if [[ "$INPUT_FORCE" == "true" ]]; then
            ARGS+=(--force)
          fi
          python automation/phase-2d3/standings.py "${ARGS[@]}"

      - name: Persist standings state
        if: ${{ (github.event_name == 'schedule' || inputs.mode == 'baseline' || inputs.mode == 'live') && success() }}
        shell: bash
        run: |
          bash automation/tools/persist_state.sh \
            automation/phase-2d3/state/standings.json \
            "chore(fantrax): persist standings state [skip ci]" \
            "BLHA Fantrax Automation"
