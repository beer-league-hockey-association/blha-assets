name: BLHA Pick Trades
run-name: BLHA Pick Trades — ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}

# Private alert when a draft pick changes owner (Constitution Article XII).
# Timing lives in automation/scheduler/schedule.yaml; the BLHA Scheduler starts
# this workflow with mode=live. Posts go to the Commissioner Desk channel.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = log only; test = one [TEST] sample alert; live = alert on moved picks"
        required: true
        default: preview
        type: choice
        options: [preview, test, live]

permissions:
  contents: write

concurrency:
  group: blha-pick-trades
  cancel-in-progress: false

jobs:
  picks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Restore saved state
        run: bash automation/tools/state_branch.sh restore "automation/commissioner/state/picktrades.json"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/common-requirements.txt

      - name: Install dependencies
        run: pip install -r automation/common-requirements.txt

      - name: Check pick ownership
        env:
          BLHA_WEBHOOK_COMMISSIONER_DESK: ${{ secrets.BLHA_WEBHOOK_COMMISSIONER_DESK }}
          # Optional: published-CSV link of the League Ledger's Pick Clearance tab.
          BLHA_LEDGER_CLEARANCE_CSV: ${{ secrets.BLHA_LEDGER_CLEARANCE_CSV }}
        run: python automation/commissioner/picktrades.py --mode "$MODE"

      # Saved even if a later step fails, so a posted alert is never repeated.
      - name: Save state to the automation-state branch
        if: ${{ !cancelled() && env.MODE == 'live' }}
        run: |
          bash automation/tools/state_branch.sh save \
            "chore(commissioner): save pick ownership" \
            "BLHA Fantrax Automation" \
            "automation/commissioner/state/picktrades.json"
