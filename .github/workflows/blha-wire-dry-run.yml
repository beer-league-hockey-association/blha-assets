name: BLHA Wire Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r automation/phase-2d1/requirements.txt

      - name: Run The Wire classifier
        run: python automation/phase-2d1/wire.py
