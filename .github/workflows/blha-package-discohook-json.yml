name: BLHA Package Frozen Discohook JSON

on:
  workflow_dispatch:
  push:
    paths:
      - 'templates/**/*.json'
      - 'discohook-backups/*.json'
      - 'constitution/*_discohook_backup.json'
      - 'tools/discohook_format.py'
      - 'tools/normalize_discohook_templates.py'
      - '.github/workflows/blha-package-discohook-json.yml'
  pull_request:
    paths:
      - 'templates/**/*.json'
      - 'discohook-backups/*.json'
      - 'constitution/*_discohook_backup.json'
      - 'tools/discohook_format.py'
      - 'tools/normalize_discohook_templates.py'
      - '.github/workflows/blha-package-discohook-json.yml'

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate raw Discohook message JSON
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import urllib.parse

          root = Path('templates')
          files = sorted(root.rglob('*.json'))
          # Every template is validated below; the count is not fixed, so
          # adding a template never breaks this check.
          assert files, 'no JSON templates found under templates/'

          allowed_root = {
              'content', 'embeds', 'username', 'avatar_url', 'attachments',
              'components', 'flags', 'thread_name', 'allowed_mentions', 'webhook_id'
          }
          allowed_embed = {
              'title', 'description', 'url', 'timestamp', 'color', 'footer',
              'image', 'thumbnail', 'video', 'provider', 'author', 'fields'
          }

          def embed_text_length(embed):
              total = len(embed.get('title') or '')
              total += len(embed.get('description') or '')
              total += len((embed.get('footer') or {}).get('text') or '')
              total += len((embed.get('author') or {}).get('name') or '')
              for field in embed.get('fields') or []:
                  total += len(field.get('name') or '')
                  total += len(field.get('value') or '')
              return total

          # BLHA format: one message per send; only the final embed has a footer
          # (its text plus the gold divider image); a channel intro starts with
          # its header banner, which has no footer.
          divider = ('https://raw.githubusercontent.com/beer-league-hockey-association/'
                     'blha-assets/main/discord/webhooks/shared/blha-footer-divider-1600x90.png')

          def image_url(embed):
              return str((embed.get('image') or {}).get('url') or '')

          def is_banner(embed):
              url = image_url(embed)
              return '-header.png' in url or 'blha-welcome-banner.png' in url

          def banner_expected(src):
              rel = src.relative_to(root).as_posix()
              return rel.endswith('_channel_intro.json') or rel == 'welcome/01_welcome.json'

          def check_blha_format(src, embeds, needs_banner):
              last = len(embeds) - 1
              for i, embed in enumerate(embeds):
                  if i < last:
                      assert 'footer' not in embed, (
                          f'{src}: embed {i + 1} has a footer; only the final embed may'
                      )
                      assert not image_url(embed).startswith(divider), (
                          f'{src}: embed {i + 1} has the footer divider; only the final embed may'
                      )
              final = embeds[last]
              text = (final.get('footer') or {}).get('text') or ''
              assert text.strip('\u200b'), f'{src}: final embed has no footer text'
              assert image_url(final).startswith(divider), (
                  f'{src}: final embed does not use the footer divider image'
              )
              for i, embed in enumerate(embeds):
                  if is_banner(embed):
                      assert i == 0, f'{src}: header banner must be the first embed'
              if needs_banner:
                  first = embeds[0]
                  assert is_banner(first) and set(first) == {'color', 'image'} and first['color'] == 0x2B2D31, (
                      f'{src}: must start with the header banner (charcoal, image only, no footer)'
                  )

          for src in files:
              payload = json.loads(src.read_text(encoding='utf-8'))
              assert isinstance(payload, dict), f'{src}: root must be an object'
              assert not ({'version', 'messages', 'backups', 'targets', 'name'} & set(payload)), (
                  f'{src}: wrapper keys are forbidden in per-message JSON'
              )
              extra_root = set(payload) - allowed_root
              assert not extra_root, f'{src}: unsupported root keys: {sorted(extra_root)}'

              embeds = payload.get('embeds')
              assert isinstance(embeds, list) and 1 <= len(embeds) <= 10, (
                  f'{src}: embeds must contain 1-10 items'
              )

              combined_text = 0
              for i, embed in enumerate(embeds, 1):
                  assert isinstance(embed, dict), f'{src}: embed {i} must be an object'
                  extra_embed = set(embed) - allowed_embed
                  assert not extra_embed, (
                      f'{src}: embed {i} unsupported keys: {sorted(extra_embed)}'
                  )

                  text_len = embed_text_length(embed)
                  combined_text += text_len
                  has_image = bool((embed.get('image') or {}).get('url'))
                  has_thumb = bool((embed.get('thumbnail') or {}).get('url'))
                  assert text_len > 0 or has_image or has_thumb, (
                      f'{src}: embed {i} would be empty in Discohook'
                  )

                  assert len(embed.get('title') or '') <= 256, f'{src}: embed {i} title too long'
                  assert len(embed.get('description') or '') <= 4096, (
                      f'{src}: embed {i} description too long'
                  )

                  fields = embed.get('fields') or []
                  assert len(fields) <= 25, f'{src}: embed {i} has too many fields'
                  for j, field in enumerate(fields, 1):
                      assert len(field.get('name') or '') <= 256, (
                          f'{src}: embed {i} field {j} name too long'
                      )
                      assert len(field.get('value') or '') <= 1024, (
                          f'{src}: embed {i} field {j} value too long'
                      )

                  for key in ('image', 'thumbnail'):
                      if key in embed:
                          url = embed[key].get('url', '')
                          parsed = urllib.parse.urlparse(url)
                          assert parsed.scheme == 'https' and parsed.netloc, (
                              f'{src}: embed {i} {key} URL must be HTTPS'
                          )

              assert combined_text <= 6000, f'{src}: total embed text exceeds 6000 characters'
              check_blha_format(src, embeds, banner_expected(src))

          # Bundles and backups hold several separate one-message templates;
          # every message in them follows the same BLHA format.
          backups = sorted(Path('discohook-backups').glob('BLHA_*.json'))
          backups += sorted(Path('constitution').glob('*_discohook_backup.json'))
          checked = 0
          for src in backups:
              payload = json.loads(src.read_text(encoding='utf-8'))
              messages = [m['data'] for m in payload['messages']] if 'messages' in payload else [payload]
              for n, message in enumerate(messages, 1):
                  embeds = message.get('embeds') or []
                  assert 1 <= len(embeds) <= 10, f'{src} message {n}: embeds must contain 1-10 items'
                  total = sum(embed_text_length(e) for e in embeds)
                  assert total <= 6000, f'{src} message {n}: total embed text exceeds 6000 characters'
                  check_blha_format(f'{src} message {n}', embeds, is_banner(embeds[0]))
                  checked += 1

          print(f'Validated {len(files)} raw per-message Discohook JSON files and {checked} bundled messages.')
          PY

      - name: Check templates match the normalizer
        run: python tools/normalize_discohook_templates.py --check

      - name: Package raw JSON files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          root = Path('templates')
          files = sorted(root.rglob('*.json'))
          out = Path('BLHA_Phase_2C6_Raw_Discohook_JSON.zip')

          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as z:
              for src in files:
                  z.write(src, src.relative_to(root).as_posix())

          with zipfile.ZipFile(out) as z:
              members = [name for name in z.namelist() if name.endswith('.json')]
              assert len(members) == len(files), (
                  f'zip contains {len(members)} JSON files, expected {len(files)}'
              )

          print(f'Created {out} with {len(files)} raw per-message JSON files.')
          PY

      - name: Upload raw JSON package
        uses: actions/upload-artifact@v4
        with:
          name: BLHA-Phase-2C6-Raw-Discohook-JSON
          path: BLHA_Phase_2C6_Raw_Discohook_JSON.zip
          if-no-files-found: error
          retention-days: 30
