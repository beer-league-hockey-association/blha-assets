name: BLHA Package Frozen Discohook JSON

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/blha-package-discohook-json.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify frozen JSON count
        shell: bash
        run: |
          count=$(find templates -type f -name '*.json' | wc -l | tr -d ' ')
          echo "Found ${count} Discohook JSON templates."
          test "$count" -eq 54

      - name: Build import-ready Discohook package
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import shutil
          import zipfile

          src_root = Path('templates')
          out_root = Path('BLHA_Phase_2C6_Discohook_Import_54')
          if out_root.exists():
              shutil.rmtree(out_root)
          out_root.mkdir(parents=True)

          files = sorted(src_root.rglob('*.json'))
          assert len(files) == 54, f'expected 54 JSON files, found {len(files)}'

          for src in files:
              payload = json.loads(src.read_text(encoding='utf-8'))
              if not isinstance(payload, dict):
                  raise AssertionError(f'{src}: raw payload root must be an object')

              wrapped = {
                  'version': 'd2',
                  'messages': [
                      {
                          'name': src.stem.replace('_', ' ').strip(),
                          'data': payload,
                      }
                  ],
              }

              rel = src.relative_to(src_root)
              dest = out_root / rel
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_text(json.dumps(wrapped, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          # Convenience bundle for the six Welcome messages, which are intended
          # to be loaded/sent in order as one channel setup pass.
          welcome_sources = sorted((src_root / 'welcome').glob('*.json'))
          welcome_bundle = {
              'version': 'd2',
              'messages': [
                  {
                      'name': src.stem.replace('_', ' ').strip(),
                      'data': json.loads(src.read_text(encoding='utf-8')),
                  }
                  for src in welcome_sources
              ],
          }
          Path('BLHA_Welcome_All_6_Discohook.json').write_text(
              json.dumps(welcome_bundle, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )

          out = Path('BLHA_Phase_2C6_Discohook_Import_54.zip')
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as z:
              for path in sorted(out_root.rglob('*.json')):
                  z.write(path, path.relative_to(out_root).as_posix())

          with zipfile.ZipFile(out) as z:
              members = [n for n in z.namelist() if n.endswith('.json')]
              assert len(members) == 54, f'zip contains {len(members)} JSON files'
              for member in members:
                  data = json.loads(z.read(member).decode('utf-8'))
                  assert data.get('version') == 'd2', f'{member}: missing d2 version'
                  assert len(data.get('messages') or []) == 1, f'{member}: must contain exactly one message'
                  assert isinstance(data['messages'][0].get('data'), dict), f'{member}: message data missing'

          print(f'Created {out} with 54 Discohook d2 import-ready JSON files.')
          print('Created BLHA_Welcome_All_6_Discohook.json with 6 ordered Welcome messages.')
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: BLHA-Phase-2C6-Discohook-Import-54
          path: |
            BLHA_Phase_2C6_Discohook_Import_54.zip
            BLHA_Welcome_All_6_Discohook.json
          if-no-files-found: error
          retention-days: 30
