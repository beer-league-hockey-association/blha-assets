name: BLHA Automation Regression Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/**/*.py'
      - 'automation/phase-2d2/events.yaml'
      - 'automation/phase-2d5/playoff_config.yaml'
      - 'automation/scheduler/schedule.yaml'
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - 'automation/**/*.py'
      - 'automation/phase-2d2/events.yaml'
      - 'automation/phase-2d5/playoff_config.yaml'
      - 'automation/scheduler/schedule.yaml'
      - '.github/workflows/*.yml'

permissions:
  contents: read

concurrency:
  group: blha-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            automation/common-requirements.txt
            automation/phase-2d1/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r automation/common-requirements.txt
          pip install -r automation/phase-2d1/requirements.txt

      - name: Compile audited automation modules
        run: |
          python -m py_compile \
            automation/discord_webhook.py \
            automation/phase-2d1/wire.py \
            automation/phase-2d1/engine.py \
            automation/phase-2d1/run_wire.py \
            automation/phase-2d1/roster_enrichment.py \
            automation/phase-2d2/league_ops.py \
            automation/phase-2d3/standings.py \
            automation/phase-2d3/scoreboard.py \
            automation/phase-2d3/weekly_recap.py \
            automation/phase-2d4/playoff_race.py \
            automation/matchup-preview/matchup_preview.py \
            automation/phase-2d5/playoff.py \
            automation/health/health.py \
            automation/health/runner.py \
            automation/scheduler/scheduler.py

      - name: Test the scheduler
        run: python automation/scheduler/test_scheduler.py

      - name: Test The Wire
        run: python automation/phase-2d1/test_wire.py

      - name: Test health-monitor run filtering
        env:
          PYTHONPATH: automation:automation/health
        run: python automation/health/test_health.py

      - name: Test shared Discord delivery
        env:
          PYTHONPATH: automation
        run: python automation/test_discord_webhook.py

      - name: Test League Office timing
        env:
          PYTHONPATH: automation:automation/phase-2d2
        run: python automation/phase-2d2/test_league_ops.py

      - name: Test playoff bracket logic
        env:
          PYTHONPATH: automation:automation/phase-2d5
        run: python automation/phase-2d5/test_playoff.py
