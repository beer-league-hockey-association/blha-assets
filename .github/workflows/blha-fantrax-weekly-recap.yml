name: BLHA Fantrax Weekly Recap

on:
  schedule:
    # Daily completion check. The script posts only when Fantrax exposes a newly
    # completed scoring period, so this remains silent on all other days.
    # 12:45 UTC = 8:45 AM EDT / 7:45 AM EST.
    - cron: "45 12 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Weekly recap mode"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - test
          - baseline
          - live
      period:
        description: "Optional scoring period override; leave blank for automatic selection"
        required: false
        type: string
      force:
        description: "Force a live repost even if that period was already recapped"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: blha-fantrax-weekly-recap
  cancel-in-progress: false

jobs:
  weekly-recap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests==2.32.5 PyYAML==6.0.2

      - name: Run Fantrax weekly recap automation
        env:
          BLHA_WEBHOOK_WEEKLY_RECAP: ${{ secrets.BLHA_WEBHOOK_WEEKLY_RECAP }}
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "Scheduled completed-period check -> LIVE mode"
            python automation/phase-2d3/weekly_recap.py --mode live
            exit $?
          fi

          FORCE=""
          PERIOD=""
          if [[ "${{ inputs.force }}" == "true" ]]; then
            FORCE="--force"
          fi
          if [[ -n "${{ inputs.period }}" ]]; then
            PERIOD="--period ${{ inputs.period }}"
          fi
          python automation/phase-2d3/weekly_recap.py --mode "${{ inputs.mode }}" $PERIOD $FORCE

      - name: Persist weekly recap state
        if: ${{ (github.event_name == 'schedule' || inputs.mode == 'baseline' || inputs.mode == 'live') && success() }}
        shell: bash
        run: |
          if git diff --quiet -- automation/phase-2d3/state/weekly_recap.json; then
            echo "No weekly recap state change."
            exit 0
          fi
          git config user.name "BLHA Fantrax Automation"
          git config user.email "actions@users.noreply.github.com"
          git add automation/phase-2d3/state/weekly_recap.json
          git commit -m "chore(fantrax): persist weekly recap state [skip ci]"
          git push
