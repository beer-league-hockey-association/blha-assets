name: BLHA Build Discord Assets

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/build_discord_assets.py'
      - 'tools/normalize_discohook_templates.py'
      - '.github/workflows/blha-build-discord-assets.yml'

permissions:
  contents: write

concurrency:
  group: blha-build-discord-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Build frozen Discohook assets
        run: python tools/build_discord_assets.py

      - name: Normalize all Discohook JSON templates
        run: python tools/normalize_discohook_templates.py

      - name: Verify required assets and frozen format
        shell: bash
        run: |
          test -s discord/webhooks/welcome/blha-welcome-banner.png
          test -s discord/webhooks/league-office/blha-constitution-header.png
          test -s discord/webhooks/league-office/blha-announcements-header.png
          test -s discord/webhooks/league-office/blha-calendar-header.png
          test -s discord/webhooks/league-office/blha-ledger-header.png
          test -s discord/webhooks/league-office/blha-voting-header.png
          test -s discord/webhooks/draft-center/blha-draft-center-header.png
          test -s discord/webhooks/shared/blha-generic-header-1600x420.png
          test -s discord/webhooks/shared/blha-footer-divider-1600x90.png
          test -s discord/webhooks/shared/blha-banner-wordmark.png

          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json

          root = Path('.')
          footer = root / 'discord/webhooks/shared/blha-footer-divider-1600x90.png'
          im = Image.open(footer)
          assert im.mode == 'RGBA', f'footer mode must be RGBA, got {im.mode}'
          alpha = im.getchannel('A')
          assert alpha.getextrema()[0] == 0, 'footer background is not transparent'

          footer_url = 'https://raw.githubusercontent.com/beer-league-hockey-association/blha-assets/main/discord/webhooks/shared/blha-footer-divider-1600x90.png?v=2c6-frozen'
          files = sorted((root / 'templates').rglob('*.json'))
          assert files, 'no Discohook JSON templates found'
          for path in files:
              data = json.loads(path.read_text(encoding='utf-8'))
              embeds = data.get('embeds') or []
              assert embeds, f'{path}: no embeds'
              assert any((e.get('image') or {}).get('url') == footer_url for e in embeds), f'{path}: frozen footer missing'
          print(f'FROZEN FORMAT VERIFIED: {len(files)} Discohook templates; transparent cache-busted footer confirmed.')
          PY

      - name: Publish frozen Phase 2C.6 package
        shell: bash
        run: |
          if git diff --quiet -- \
            BLHA_URL_MAP.txt \
            discord/webhooks \
            templates; then
            echo 'No Discohook asset/template changes to publish.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BLHA_URL_MAP.txt discord/webhooks templates
          git commit -m 'assets(discord): publish frozen Phase 2C.6 Discohook format'

          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Publish attempt ${attempt} failed; retrying..."
            sleep $((attempt * 3))
          done

          echo 'Unable to publish generated Discord assets/templates after retries.' >&2
          exit 1
