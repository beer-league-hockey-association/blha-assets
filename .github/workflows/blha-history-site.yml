name: BLHA History Site
run-name: BLHA History Site — ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}

# Builds the league history website (tools/build_site.py) from main plus the
# archive on the automation-state branch, and publishes it to Cloudflare Pages
# as a standalone site: visitors only ever see the site's own address.
# Timing lives in automation/scheduler/schedule.yaml (daily, after the
# archive); the BLHA Scheduler starts this workflow with mode=live.
#
# One-time setup (README, "History website"): repository secrets
# CLOUDFLARE_API_TOKEN (permission: Account > Cloudflare Pages > Edit) and
# CLOUDFLARE_ACCOUNT_ID. The Pages project named in automation/league.yaml
# (history_site.cloudflare_project) is created on the first live run.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = build and attach the site to the run; live = build and publish to Cloudflare Pages"
        required: true
        default: preview
        type: choice
        options: [preview, live]

permissions:
  contents: read

concurrency:
  group: blha-history-site
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # The branch does not exist until the first state save; the site then
      # builds from an empty archive.
      - name: Check out the archive (automation-state branch)
        id: state
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          ref: automation-state
          path: state
          fetch-depth: 1
          sparse-checkout: archive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            automation/common-requirements.txt
            automation/history/requirements.txt

      - name: Install dependencies
        run: pip install -r automation/common-requirements.txt -r automation/history/requirements.txt

      - name: Build the site
        run: python tools/build_site.py --archive state/archive --out site

      - name: Attach the site to the run (preview)
        if: ${{ env.MODE != 'live' }}
        uses: actions/upload-artifact@v7
        with:
          name: history-site-preview
          path: site/
          retention-days: 7

      - name: Set up Node (for Cloudflare's Wrangler)
        if: ${{ env.MODE == 'live' }}
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Publish to Cloudflare Pages
        if: ${{ env.MODE == 'live' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets first (README, History website)."
            exit 1
          fi
          PROJECT=$(python -c "import sys; sys.path.insert(0, 'automation'); from blha.league import load_league; print((load_league().get('history_site') or {}).get('cloudflare_project') or 'blha-history')")
          echo "Cloudflare Pages project: $PROJECT"
          WRANGLER="npx --yes wrangler@4"
          if ! $WRANGLER pages project list 2>/dev/null | grep -qw "$PROJECT"; then
            echo "Creating the Pages project $PROJECT (first publish)"
            $WRANGLER pages project create "$PROJECT" --production-branch main
          fi
          $WRANGLER pages deploy site --project-name "$PROJECT" --branch main --commit-message "League history update" --commit-dirty=true
