name: BLHA History Site
run-name: BLHA History Site — ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}

# Builds the league history website (tools/build_site.py) from main plus the
# archive on the automation-state branch, and publishes it to GitHub Pages.
# Timing lives in automation/scheduler/schedule.yaml (weekly); the BLHA
# Scheduler starts this workflow with mode=live. Run it by hand any time.
#
# One-time setup: repository Settings > Pages > Build and deployment >
# Source: GitHub Actions. Until then the deploy step fails.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = build and attach the site to the run; live = build and publish to GitHub Pages"
        required: true
        default: preview
        type: choice
        options: [preview, live]

permissions:
  contents: read

concurrency:
  group: blha-history-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # The branch does not exist until the first state save; the site then
      # builds from an empty archive.
      - name: Check out the archive (automation-state branch)
        id: state
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          ref: automation-state
          path: state
          fetch-depth: 1
          sparse-checkout: archive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            automation/common-requirements.txt
            automation/history/requirements.txt

      - name: Install dependencies
        run: pip install -r automation/common-requirements.txt -r automation/history/requirements.txt

      - name: Build the site
        run: python tools/build_site.py --archive state/archive --out site

      - name: Attach the site to the run (preview)
        if: ${{ env.MODE != 'live' }}
        uses: actions/upload-artifact@v7
        with:
          name: history-site-preview
          path: site/
          retention-days: 7

      - name: Upload the Pages artifact
        if: ${{ env.MODE == 'live' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    needs: build
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode || 'live') == 'live' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
