name: BLHA Fantrax Playoffs
run-name: BLHA Fantrax Playoffs — ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}

# Live playoff bracket. Seeds are saved automatically after the final
# regular-season week. Timing lives in automation/scheduler/schedule.yaml; the
# BLHA Scheduler starts this workflow with mode=live hourly during playoff weeks.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = log only; test = post a [TEST] bracket; baseline = save seeds now; live = update the bracket"
        required: true
        default: preview
        type: choice
        options: [preview, test, baseline, live]
      week:
        description: "Render as if this playoff week were current (preview/test only)"
        required: false
        default: ""
        type: string
      force:
        description: "Live only: post a new bracket message even if unchanged"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: blha-fantrax-playoffs
  cancel-in-progress: false

jobs:
  playoffs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}
      WEEK: ${{ inputs.week }}
      FORCE: ${{ inputs.force || false }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/common-requirements.txt

      - name: Install dependencies
        run: pip install -r automation/common-requirements.txt

      - name: Run playoff bracket
        env:
          BLHA_WEBHOOK_PLAYOFFS: ${{ secrets.BLHA_WEBHOOK_PLAYOFFS }}
        shell: bash
        run: |
          ARGS=(--mode "$MODE")
          if [[ -n "$WEEK" ]]; then ARGS+=(--week "$WEEK"); fi
          if [[ "$FORCE" == "true" ]]; then ARGS+=(--force); fi
          python automation/playoffs/playoff.py "${ARGS[@]}"

      - name: Persist playoff state
        if: ${{ !cancelled() && (env.MODE == 'live' || env.MODE == 'baseline') }}
        shell: bash
        run: |
          bash automation/tools/persist_state.sh \
            automation/playoffs/state/playoff.json \
            "chore(fantrax): persist playoff state [skip ci]" \
            "BLHA Fantrax Automation"
