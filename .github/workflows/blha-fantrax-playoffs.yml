name: BLHA Fantrax Playoffs

on:
  schedule:
    # Bracket state changes at scoring-period boundaries, so six-hour checks
    # are sufficient while keeping pre-playoff no-op traffic low.
    - cron: "7 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Playoff automation mode"
        required: true
        default: preview
        type: choice
        options: [preview, test, baseline, live]
      period:
        description: "Optional playoff period override for testing (23, 24, or 25)"
        required: false
        default: ""
        type: string
      force:
        description: "Force a live Discord post even if unchanged"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: blha-fantrax-playoffs
  cancel-in-progress: false

jobs:
  playoffs:
    runs-on: ubuntu-latest
    env:
      INPUT_MODE: ${{ inputs.mode }}
      INPUT_PERIOD: ${{ inputs.period }}
      INPUT_FORCE: ${{ inputs.force }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/common-requirements.txt

      - name: Install dependencies
        run: pip install -r automation/common-requirements.txt

      - name: Run Fantrax playoff automation
        env:
          BLHA_WEBHOOK_PLAYOFFS: ${{ secrets.BLHA_WEBHOOK_PLAYOFFS }}
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            python automation/phase-2d5/runner.py --mode live
            exit $?
          fi

          ARGS=(--mode "$INPUT_MODE")
          if [[ -n "$INPUT_PERIOD" ]]; then
            ARGS+=(--period "$INPUT_PERIOD")
          fi
          if [[ "$INPUT_FORCE" == "true" ]]; then
            ARGS+=(--force)
          fi
          python automation/phase-2d5/runner.py "${ARGS[@]}"

      - name: Persist playoff state
        if: ${{ (github.event_name == 'schedule' || inputs.mode == 'baseline' || inputs.mode == 'live') && success() }}
        shell: bash
        run: |
          bash automation/tools/persist_state.sh \
            automation/phase-2d5/state/playoff.json \
            "chore(fantrax): persist playoff state [skip ci]" \
            "BLHA Fantrax Automation"
