name: BLHA Fantrax Playoff Race
run-name: BLHA Fantrax Playoff Race — ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}

on:
  # Timing lives in automation/scheduler/schedule.yaml; the BLHA Scheduler
  # starts this workflow with mode=live when it is due.
  workflow_dispatch:
    inputs:
      mode:
        description: "Playoff-race mode"
        required: true
        default: preview
        type: choice
        options: [preview, test, baseline, live]
      force:
        description: "Force a live post even if the race is unchanged"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: blha-fantrax-playoff-race
  cancel-in-progress: false

jobs:
  playoff-race:
    runs-on: ubuntu-latest
    env:
      INPUT_MODE: ${{ inputs.mode }}
      INPUT_FORCE: ${{ inputs.force }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/common-requirements.txt

      - name: Install dependencies
        run: pip install -r automation/common-requirements.txt

      - name: Run Fantrax playoff-race automation
        env:
          BLHA_WEBHOOK_PLAYOFF_RACE: ${{ secrets.BLHA_WEBHOOK_PLAYOFF_RACE }}
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "Scheduled playoff-race check -> LIVE mode"
            python automation/phase-2d4/playoff_race.py --mode live
            exit $?
          fi

          ARGS=(--mode "$INPUT_MODE")
          if [[ "$INPUT_FORCE" == "true" ]]; then
            ARGS+=(--force)
          fi
          python automation/phase-2d4/playoff_race.py "${ARGS[@]}"

      - name: Persist playoff-race state
        if: ${{ (github.event_name == 'schedule' || inputs.mode == 'baseline' || inputs.mode == 'live') && success() }}
        shell: bash
        run: |
          bash automation/tools/persist_state.sh \
            automation/phase-2d4/state/playoff_race.json \
            "chore(fantrax): persist playoff-race state [skip ci]" \
            "BLHA Fantrax Automation"
