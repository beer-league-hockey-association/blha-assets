name: BLHA Fantrax League Transactions Probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blha-fantrax-transactions-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests==2.32.5

      - name: Probe Fantrax league transaction history
        env:
          # Optional only. Leave unset unless anonymous access proves insufficient
          # and we deliberately decide to test authenticated read-only access.
          FANTRAX_COOKIE: ${{ secrets.FANTRAX_COOKIE }}
        run: |
          python automation/league-transactions/probe.py --league-id w02cjakmmumb3lur
