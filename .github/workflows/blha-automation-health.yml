name: BLHA Automation Health
run-name: BLHA Automation Health — ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}

on:
  # Timing lives in automation/scheduler/schedule.yaml; the BLHA Scheduler
  # starts this workflow with mode=live when it is due.
  workflow_dispatch:
    inputs:
      mode:
        description: "Health monitor mode"
        required: true
        default: preview
        type: choice
        options: [preview, test, live]

permissions:
  actions: read
  contents: write

concurrency:
  group: blha-automation-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      INPUT_MODE: ${{ inputs.mode }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Restore saved state
        run: bash automation/tools/state_branch.sh restore "automation/health/state/health.json"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/common-requirements.txt

      - name: Install dependencies
        run: pip install -r automation/common-requirements.txt

      - name: Run automation health monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLHA_WEBHOOK_AUTOMATION_HEALTH: ${{ secrets.BLHA_WEBHOOK_AUTOMATION_HEALTH }}
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            python automation/health/health.py --mode live
          else
            python automation/health/health.py --mode "$INPUT_MODE"
          fi

      # Saved even if one post failed, so posts that did go out are never repeated.
      - name: Save state to the automation-state branch
        if: ${{ (github.event_name == 'schedule' || inputs.mode == 'live') && !cancelled() }}
        run: |
          bash automation/tools/state_branch.sh save \
            "chore(automation-health): save issue state" \
            "BLHA Systems Automation" \
            "automation/health/state/health.json"
