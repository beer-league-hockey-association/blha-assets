name: BLHA Automation Health

on:
  schedule:
    - cron: "27 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Health monitor mode"
        required: true
        default: preview
        type: choice
        options: [preview, test, live]

permissions:
  actions: read
  contents: write

concurrency:
  group: blha-automation-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      INPUT_MODE: ${{ inputs.mode }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/common-requirements.txt

      - name: Install dependencies
        run: pip install -r automation/common-requirements.txt

      - name: Run automation health monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLHA_WEBHOOK_AUTOMATION_HEALTH: ${{ secrets.BLHA_WEBHOOK_AUTOMATION_HEALTH }}
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            python automation/health/runner.py --mode live
          else
            python automation/health/runner.py --mode "$INPUT_MODE"
          fi

      - name: Persist automation health state
        if: ${{ (github.event_name == 'schedule' || inputs.mode == 'live') && success() }}
        shell: bash
        run: |
          bash automation/tools/persist_state.sh \
            automation/health/state/health.json \
            "chore(automation-health): persist issue state [skip ci]" \
            "BLHA Systems Automation"
