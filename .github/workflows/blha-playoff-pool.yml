name: BLHA Playoff Pool
run-name: BLHA Playoff Pool — ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}

# Free NHL playoff box pool in 🏒│game-day (just for fun: no money, no effect on
# the league). Timing lives in automation/scheduler/schedule.yaml (07:45 and
# 19:45, only inside the NHL playoff window). Code and how entries work:
# automation/playoff_pool/README.md.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = log only; test = [TEST] posts; live = post what is due and save state"
        required: true
        default: preview
        type: choice
        options: [preview, test, live]
      year:
        description: "Optional, preview/test only: a past NHL playoff year to run against, e.g. 2025"
        required: false
        default: ""
        type: string

# contents: write only to save state on the automation-state branch.
permissions:
  contents: write

concurrency:
  group: blha-playoff-pool
  cancel-in-progress: false

jobs:
  pool:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}
      YEAR: ${{ github.event_name == 'workflow_dispatch' && inputs.year || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Restore saved state
        run: |
          bash automation/tools/state_branch.sh restore \
            "automation/playoff_pool/state/pool.json" \
            "automation/playoff_pool/state/boxes.json"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/common-requirements.txt

      - name: Install dependencies
        run: pip install -r automation/common-requirements.txt

      - name: Run Playoff Pool
        env:
          BLHA_WEBHOOK_GAME_DAY: ${{ secrets.BLHA_WEBHOOK_GAME_DAY }}
        run: python automation/playoff_pool/pool.py --mode "$MODE" --year "$YEAR"

      - name: Save state to the automation-state branch
        if: ${{ !cancelled() && env.MODE == 'live' }}
        run: |
          bash automation/tools/state_branch.sh save \
            "chore(pool): save playoff pool state" \
            "BLHA Fantrax Automation" \
            "automation/playoff_pool/state/pool.json" \
            "automation/playoff_pool/state/boxes.json"
