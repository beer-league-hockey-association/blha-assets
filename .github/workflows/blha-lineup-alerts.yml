name: BLHA Lineup Alerts
run-name: BLHA Lineup Alerts — ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}

# Daily check for opted-in owners (league.yaml `owners`): a starter with no NHL
# game today while an eligible bench player has one. Posts to #lineup-alerts.
# Timing lives in automation/scheduler/schedule.yaml; the BLHA Scheduler starts
# this workflow with mode=live at 15:00 ET during the regular season and playoffs.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = log only; test = [TEST] posts, nobody pinged; live = alert opted-in owners"
        required: true
        default: preview
        type: choice
        options: [preview, test, live]
      all_teams:
        description: "Preview/test only: also check franchises with no opted-in owner (never pinged)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: blha-lineup-alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}
      ALL_TEAMS: ${{ inputs.all_teams || false }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Restore saved state
        run: bash automation/tools/state_branch.sh restore "automation/lineup/state/lineup_alerts.json"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/common-requirements.txt

      - name: Install dependencies
        run: pip install -r automation/common-requirements.txt

      - name: Run Lineup Alerts
        env:
          BLHA_WEBHOOK_LINEUP_ALERTS: ${{ secrets.BLHA_WEBHOOK_LINEUP_ALERTS }}
        shell: bash
        run: |
          ARGS=(--mode "$MODE")
          if [[ "$ALL_TEAMS" == "true" ]]; then ARGS+=(--all-teams); fi
          python automation/lineup/alerts.py "${ARGS[@]}"

      # Saved even if one post failed, so alerts that did go out are never repeated.
      - name: Save state to the automation-state branch
        if: ${{ !cancelled() && env.MODE == 'live' }}
        run: |
          bash automation/tools/state_branch.sh save \
            "chore(lineup): save lineup alert state" \
            "BLHA Fantrax Automation" \
            "automation/lineup/state/lineup_alerts.json"
