name: BLHA Fantrax Scoreboard
run-name: BLHA Fantrax Scoreboard — ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}

# One live-updating scoreboard message per week.
# Timing lives in automation/scheduler/schedule.yaml; the BLHA Scheduler starts
# this workflow with mode=live hourly during the regular season and playoffs.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = log only; test = post a [TEST] scoreboard; live = update the live message"
        required: true
        default: preview
        type: choice
        options: [preview, test, live]
      week:
        description: "Week to render (preview/test only; blank = current)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: blha-fantrax-scoreboard
  cancel-in-progress: false

jobs:
  scoreboard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}
      WEEK: ${{ inputs.week }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Restore saved state
        run: bash automation/tools/state_branch.sh restore "automation/competition/state/scoreboard.json"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/common-requirements.txt

      - name: Install dependencies
        run: pip install -r automation/common-requirements.txt

      - name: Update live scoreboard
        env:
          BLHA_WEBHOOK_SCOREBOARD: ${{ secrets.BLHA_WEBHOOK_SCOREBOARD }}
        shell: bash
        run: |
          ARGS=(--mode "$MODE")
          if [[ -n "$WEEK" ]]; then ARGS+=(--week "$WEEK"); fi
          python automation/competition/scoreboard.py "${ARGS[@]}"

      # Saved even if one post failed, so posts that did go out are never repeated.
      - name: Save state to the automation-state branch
        if: ${{ !cancelled() && env.MODE == 'live' }}
        run: |
          bash automation/tools/state_branch.sh save \
            "chore(fantrax): save scoreboard state" \
            "BLHA Fantrax Automation" \
            "automation/competition/state/scoreboard.json"
