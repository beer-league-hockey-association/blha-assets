name: BLHA Fantrax Scoreboard
run-name: BLHA Fantrax Scoreboard — ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}

on:
  # Timing lives in automation/scheduler/schedule.yaml; the BLHA Scheduler
  # starts this workflow with mode=live when it is due.
  workflow_dispatch:
    inputs:
      mode:
        description: "Scoreboard mode"
        required: true
        default: preview
        type: choice
        options: [preview, test, baseline, live]
      period:
        description: "Optional scoring period override; leave blank for current period"
        required: false
        type: string
      force:
        description: "Force a live post even if scoreboard is unchanged"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: blha-fantrax-scoreboard
  cancel-in-progress: false

jobs:
  scoreboard:
    runs-on: ubuntu-latest
    env:
      INPUT_MODE: ${{ inputs.mode }}
      INPUT_PERIOD: ${{ inputs.period }}
      INPUT_FORCE: ${{ inputs.force }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/common-requirements.txt

      - name: Install dependencies
        run: pip install -r automation/common-requirements.txt

      - name: Run Fantrax scoreboard automation
        env:
          BLHA_WEBHOOK_SCOREBOARD: ${{ secrets.BLHA_WEBHOOK_SCOREBOARD }}
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "Scheduled scoreboard snapshot -> LIVE mode"
            python automation/phase-2d3/scoreboard.py --mode live
            exit $?
          fi

          ARGS=(--mode "$INPUT_MODE")
          if [[ "$INPUT_FORCE" == "true" ]]; then
            ARGS+=(--force)
          fi
          if [[ -n "$INPUT_PERIOD" ]]; then
            ARGS+=(--period "$INPUT_PERIOD")
          fi
          python automation/phase-2d3/scoreboard.py "${ARGS[@]}"

      - name: Persist scoreboard state
        if: ${{ (github.event_name == 'schedule' || inputs.mode == 'baseline' || inputs.mode == 'live') && success() }}
        shell: bash
        run: |
          bash automation/tools/persist_state.sh \
            automation/phase-2d3/state/scoreboard.json \
            "chore(fantrax): persist scoreboard state [skip ci]" \
            "BLHA Fantrax Automation"
