name: BLHA Fantrax Matchup Preview
run-name: BLHA Fantrax Matchup Preview — ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}

on:
  # Timing lives in automation/scheduler/schedule.yaml; the BLHA Scheduler
  # starts this workflow with mode=live when it is due.
  workflow_dispatch:
    inputs:
      mode:
        description: "Matchup preview mode"
        required: true
        default: preview
        type: choice
        options: [preview, test, live]
      period:
        description: "Optional scoring period override for preview/test"
        required: false
        default: ""
        type: string
      force:
        description: "Force a live Discord post even if this period was already posted"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: blha-fantrax-matchup-preview
  cancel-in-progress: false

jobs:
  matchup-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      INPUT_MODE: ${{ inputs.mode }}
      INPUT_PERIOD: ${{ inputs.period }}
      INPUT_FORCE: ${{ inputs.force }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/common-requirements.txt

      - name: Install dependencies
        run: pip install -r automation/common-requirements.txt

      - name: Run Fantrax matchup preview
        env:
          BLHA_WEBHOOK_SCOREBOARD: ${{ secrets.BLHA_WEBHOOK_SCOREBOARD }}
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            python automation/matchup-preview/matchup_preview.py --mode live
            exit $?
          fi

          ARGS=(--mode "$INPUT_MODE")
          if [[ -n "$INPUT_PERIOD" ]]; then
            ARGS+=(--period "$INPUT_PERIOD")
          fi
          if [[ "$INPUT_FORCE" == "true" ]]; then
            ARGS+=(--force)
          fi
          python automation/matchup-preview/matchup_preview.py "${ARGS[@]}"

      - name: Persist matchup preview state
        if: ${{ (github.event_name == 'schedule' || inputs.mode == 'live') && success() }}
        shell: bash
        run: |
          bash automation/tools/persist_state.sh \
            automation/matchup-preview/state/matchup_preview.json \
            "chore(fantrax): persist matchup preview state [skip ci]" \
            "BLHA Fantrax Automation"
