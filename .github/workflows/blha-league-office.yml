name: BLHA League Office Automation

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: dry-run
        type: choice
        options: [dry-run, live, test]
      channel:
        description: "Only used for test mode"
        required: true
        default: choose-channel
        type: choice
        options: [choose-channel, league-calendar, league-announcements]
      reset_state:
        description: "Clear League Office delivery state before this run"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: blha-league-office
  cancel-in-progress: false

jobs:
  league-office:
    runs-on: ubuntu-latest
    env:
      INPUT_MODE: ${{ inputs.mode }}
      INPUT_CHANNEL: ${{ inputs.channel }}
      INPUT_RESET_STATE: ${{ inputs.reset_state }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/common-requirements.txt

      - name: Install dependencies
        run: pip install -r automation/common-requirements.txt

      - name: Run League Office automation
        env:
          BLHA_WEBHOOK_LEAGUE_CALENDAR: ${{ secrets.BLHA_WEBHOOK_LEAGUE_CALENDAR }}
          BLHA_WEBHOOK_LEAGUE_ANNOUNCEMENTS: ${{ secrets.BLHA_WEBHOOK_LEAGUE_ANNOUNCEMENTS }}
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            python automation/phase-2d2/league_ops.py --mode live
            exit $?
          fi

          if [[ "$INPUT_MODE" == "test" ]]; then
            if [[ "$INPUT_CHANNEL" == "choose-channel" ]]; then
              echo "ERROR: choose league-calendar or league-announcements for test mode."
              exit 1
            fi
            python automation/phase-2d2/league_ops.py --mode test --channel "$INPUT_CHANNEL"
          else
            ARGS=(--mode "$INPUT_MODE")
            if [[ "$INPUT_RESET_STATE" == "true" ]]; then
              ARGS+=(--reset-state)
            fi
            python automation/phase-2d2/league_ops.py "${ARGS[@]}"
          fi

      - name: Persist League Office state
        if: ${{ (github.event_name == 'schedule' || inputs.mode == 'live') && success() }}
        shell: bash
        run: |
          bash automation/tools/persist_state.sh \
            automation/phase-2d2/state/league_ops.json \
            "chore(league-office): persist reminder state [skip ci]" \
            "BLHA League Office Automation"
